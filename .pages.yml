# Pages CMS -asetukset (https://app.pagescms.org). Lukukauden vaihtuessa päivitä
# Läksyt-kansio ja kurssiryhmät. Kurssivalinnat päivittyvät Jakson mukaan. Ks. README.md.

media:
  input: media
  output: /media
  rename: safe
  categories: [document, image]

settings:
  content:
    merge: true

content:
  - name: laksyt
    label: Läksyt
    type: collection
    path: _posts/2026-2027
    filename: "{year}-{month}-{day}-{primary}.md"
    subfolders: false
    view:
      fields: [title, tags]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Otsikko
        type: string
        required: true
        description: "esim. Läksy ti 19.5. tunnille"
      - name: tags
        label: Kurssi
        type: select
        required: true
        options:
          values:
            # kurssit:start (updated automatically for the current Jakso by .github/workflows/pages-cms-courses.yml)
            - name: "ena01-02.8 läksyt"
              label: ENA01-02.8
            - name: "rub11-12.3 läksyt"
              label: RUB11-12.3
            - name: "rub11-12.9 läksyt"
              label: RUB11-12.9
            - name: "rub112.4 läksyt"
              label: RUB112.4
            - name: "rub13.3 läksyt"
              label: RUB13.3
            - name: "rub13.5 läksyt"
              label: RUB13.5
            - name: "rub14.8 läksyt"
              label: RUB14.8
            - name: "rub14.9 läksyt"
              label: RUB14.9
            - name: "rub15.9 läksyt"
              label: RUB15.9
            - name: "rub16.4 läksyt"
              label: RUB16.4
            - name: "rub17.1 läksyt"
              label: RUB17.1
            - name: "rub17.4 läksyt"
              label: RUB17.4
            # kurssit:end
      - name: published
        label: Julkaistu
        type: boolean
        default: true
      - name: body
        label: Sisältö
        type: rich-text

  - name: ena01-02_8
    label: ENA01-02.8
    type: group
    items:
      - name: ena01-02_8_aikataulu
        label: Aikataulu
        type: file
        path: _data/schedule_2026-2027_ena01-02_8.yml
        format: yaml
        list: true
        fields: &aikataulu
          - name: date
            label: Pvm
            type: string
            required: true
            description: "esim. ti 7.4."
          - name: title
            label: Tunnin aihe
            type: string
          - name: grammar
            label: Kielioppi
            type: string
          - name: digi
            label: Digitehtävät
            type: string
          - name: other
            label: Muuta
            type: string
      - name: ena01-02_8_materiaali
        label: Materiaali
        type: file
        path: kurssit/2026-2027/ena01-02.8/materiaali/index.md
        fields: &sivu
          - name: body
            label: Sisältö
            type: rich-text
      - name: ena01-02_8_kurssiinfo
        label: Kurssi-info
        type: file
        path: kurssit/2026-2027/ena01-02.8/kurssi-info/index.md
        fields: *sivu

