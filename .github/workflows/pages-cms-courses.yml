# Keeps the Läksyt "Kurssi" dropdown in .pages.yml limited to the courses of
# the current Jakso. Runs when the period, course data or semester changes.
name: Update Pages CMS course list

on:
  push:
    branches: [master]
    paths:
      - _data/asetukset.yml
      - "_data/courses_*.yml"
      - _config.yml
      - .github/scripts/pages-cms-courses.rb
      - .github/workflows/pages-cms-courses.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-cms-courses
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Update course list
        run: ruby .github/scripts/pages-cms-courses.rb

      - name: Commit and push
        run: |
          if git diff --quiet -- .pages.yml; then
            echo "No change to .pages.yml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml
          git commit -m "Update Pages CMS course list for current period"
          # A CMS save can land between the pull and the push; if so, pull
          # again and retry. A failed rebase is a real conflict, so stop.
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin master; then
              git rebase --abort || true
              echo "::error::Rebasing onto master failed"
              exit 1
            fi
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt of 5), retrying"
            sleep $((attempt * 5))
          done
          exit 1
